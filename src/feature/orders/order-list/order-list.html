<div class="orders-page">

  <!-- Header -->
  <div class="page-header">
    <div class="header-text">
      <p class="page-label">Management</p>
      <h1>Orders</h1>
      <p class="page-subtitle">Track and manage all store orders</p>
    </div>
    <span class="stat-pill">
      <span class="dot"></span>
      {{ ordersService.orders().length }} Orders
    </span>
  </div>

  <div class="orders-layout">

    <!-- Sidebar -->
    <div class="orders-sidebar">
      @for (order of ordersService.orders(); track order.id; let i = $index) {
        <div class="order-card"
             [class.active]="selectedOrderId() === order.id"
             [style.animation-delay]="(i * 0.04) + 's'"
             (click)="selectOrder(order.id)">

          <div class="top-row">
            <span class="order-id">#LX-{{ order.id }}</span>
            <app-order-status-badge [status]="order.status" />
          </div>

          <div class="bottom-row">
            <span class="order-date">{{ order.createdAt | date:'MMM d, y' }}</span>
            <span class="order-price">${{ order.totalPrice }}</span>
          </div>

        </div>
      }
    </div>

    <!-- Details -->
    <div class="order-details-wrapper">
      <app-order-details [orderId]="selectedOrderId()" />
    </div>

  </div>

</div>

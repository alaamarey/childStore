<div class="container">

    <h1>Products</h1>

    <!-- FILTERS -->

    <div class="filters">

        <input type="text" placeholder="Search..." [(ngModel)]="search">

        <input type="number" placeholder="Min Price" [(ngModel)]="minPrice">

        <input type="number" placeholder="Max Price" [(ngModel)]="maxPrice">

        <button (click)="applyFilters()">
            Search
        </button>

    </div>

    <!-- PRODUCTS -->

    <div class="products-grid">

        @for(product of products; track product.id){

        <div class="card ">



            <div [routerLink]="['/details', product.id]" class="cursor-pointer">
                <img [src]="product.image">

                <h3>
                    {{ product.title }}
                </h3>

                <p class="price">
                    $ {{ product.price }}
                </p>

                <p>
                    {{ product.description }}
                </p>

                <div class="details">

                    <span>
                        ⭐ {{ product.rate }}
                    </span>

                    <span>
                        Stock: {{ product.stock }}
                    </span>

                </div>

            </div>


            <div class="category  cursor-pointer">
                <p>
                    Add To Cart
                </p>
            </div>

        </div>


        }

    </div>

    <!-- PAGINATION -->

    <div class="pagination">

        <button (click)="previousPage()" [disabled]="page == 1">
            Prev
        </button>

        <span>
            Page {{ page }} of {{ totalPages }}
        </span>

        <button (click)="nextPage()" [disabled]="page == totalPages">
            Next
        </button>

    </div>

</div>

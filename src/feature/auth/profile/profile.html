<div class="container mt-5">

    <div class="card shadow-sm p-4 mx-auto"
         style="max-width: 600px; border:1px solid #e6e6e6; border-radius:14px;">

        <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-secondary"></i>
            <h3 class="mt-2">My Profile</h3>
        </div>

        <div *ngIf="profile">

            <div class="mb-3">
                <small class="text-muted">Full Name</small>
                <p class="mb-0 fw-semibold">{{ profile.fullName }}</p>
            </div>

            <hr>

            <div class="mb-3">
                <small class="text-muted">Address</small>
                <p class="mb-0 fw-semibold">{{ profile.address }}</p>
            </div>

            <hr>

            <div class="mb-3">
                <small class="text-muted">Phone Number</small>
                <p class="mb-0 fw-semibold">{{ profile.phoneNumber }}</p>
            </div>

            <hr>

            <div class="mb-4">
                <small class="text-muted">Payment Details</small>
                <p class="mb-0 fw-semibold">
                    {{ profile.paymentDetails || 'Not Added Yet' }}
                </p>
            </div>

        </div>

        <button class="btn btn-success w-100" (click)="goToUpdateProfile()">
            Update Profile
        </button>

    </div>

</div>

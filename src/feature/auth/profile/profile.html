<div class="profile-page">
  <div class="profile-card">

    <!-- Header -->
    <div class="profile-header">
      <div class="profile-avatar">👤</div>
      <h2>My Profile</h2>
      <span class="profile-badge">Account Details</span>
    </div>

    <div *ngIf="profile">

      <div class="profile-field">
        <label>👤 Full Name</label>
        <p>{{ profile.fullName }}</p>
      </div>

      <div class="profile-field">
        <label>📍 Address</label>
        <p>{{ profile.address }}</p>
      </div>

      <div class="profile-field">
        <label>📞 Phone Number</label>
        <p>{{ profile.phoneNumber }}</p>
      </div>

      <div class="profile-field">
        <label>💳 Payment Details</label>
        <p [class.empty]="!profile.paymentDetails">
          {{ profile.paymentDetails || 'Not Added Yet' }}
        </p>
      </div>

    </div>

    <button class="btn-update-profile" (click)="goToUpdateProfile()">
      ✏️ Update Profile
    </button>

  </div>
</div>

<div class="update-profile-page">
  <div class="update-profile-card">

    <!-- Header -->
    <div class="profile-header">
      <div class="profile-avatar">✏️</div>
      <h2>Update Profile</h2>
      <span class="profile-badge">Edit Your Details</span>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="submit()">

      <div class="profile-field-input">
        <label>👤 Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input class="form-control"
                 formControlName="fullName"
                 placeholder="Full Name">
        </div>
      </div>

      <div class="profile-field-input">
        <label>📍 Address</label>
        <div class="input-wrap">
          <span class="input-icon">📍</span>
          <input class="form-control"
                 formControlName="address"
                 placeholder="Address">
        </div>
      </div>

      <div class="profile-field-input">
        <label>📞 Phone Number</label>
        <div class="input-wrap">
          <span class="input-icon">📞</span>
          <input class="form-control"
                 formControlName="phoneNumber"
                 placeholder="Phone Number">
        </div>
      </div>

      <div class="profile-field-input">
        <label>💳 Payment Details</label>
        <div class="input-wrap">
          <span class="input-icon">💳</span>
          <input class="form-control"
                 formControlName="paymentDetails"
                 placeholder="Payment Details">
        </div>
      </div>

      <button class="btn-save-profile" type="submit">
        💾 Save Changes
      </button>

    </form>

  </div>
</div>

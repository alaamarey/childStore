<div class="d-flex justify-content-center align-items-center vh-100 bg-light">

  <div class="card p-4 shadow-sm"
       style="width: 420px; border: 1px solid #e6e6e6; border-radius: 12px;">

    <h3 class="text-center mb-4">Register</h3>

    <form [formGroup]="registerForm" (ngSubmit)="submit()" 
          class="d-flex flex-column gap-3">

      <input formControlName="fullName" placeholder="Full Name" class="form-control">

      <input formControlName="email" placeholder="Email" class="form-control">

      <input formControlName="phoneNumber" placeholder="Phone" class="form-control">

      <input formControlName="password" placeholder="Password" type="password" class="form-control">

      <input formControlName="address" placeholder="Address" class="form-control">

      <select formControlName="role" class="form-control">
        <option value="Customer">Customer</option>
        <option value="Seller">Seller</option>
      </select>

      <button type="submit" class="btn btn-primary w-100">
        Register
      </button>

    </form>

  </div>

</div>

<!-- الصفحة الكاملة -->
<div class="register-page">

  <!-- Navbar -->
  <nav class="register-nav">
    <span class="brand">Yalla Shop</span>
    <a  routerLink="/products">← Back to Home</a>
  </nav>

  <!-- Main Content -->
  <div class="register-main">

    <!-- Left: Text + Hero -->
    <div class="register-left">
      <h1>Join Our<br>Community.</h1>
      <p>Create your account and start exploring premium products. Fast, secure, and designed with you in mind.</p>
      <div class="hero-placeholder"></div>
    </div>

    <!-- Right: Card -->
    <div class="register-card">

      <!-- Tabs -->
      <div class="register-tabs">
       
        <button class="tab active">Register</button>
      </div>

      <h2>Create Account</h2>
      <p class="subtitle">Fill in your details to get started.</p>

      <form [formGroup]="registerForm" (ngSubmit)="submit()" class="register-form">

        <!-- Row: Full Name + Phone -->
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input formControlName="fullName"
                     placeholder="John Doe"
                     class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <div class="input-wrap">
              <span class="input-icon">📞</span>
              <input formControlName="phoneNumber"
                     placeholder="+20 1XX XXX XXXX"
                     class="form-control">
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group full-width">
          <label>Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input formControlName="email"
                   placeholder="name@example.com"
                   class="form-control">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group full-width">
          <label>Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input formControlName="password"
                   placeholder="••••••••"
                   type="password"
                   class="form-control">
          </div>
        </div>

        <!-- Row: Address + Role -->
        <div class="form-row">
          <div class="form-group address-col">
            <label>Address</label>
            <div class="input-wrap">
              <span class="input-icon">📍</span>
              <input formControlName="address"
                     placeholder="Your address"
                     class="form-control">
            </div>
          </div>
          <div class="form-group role-col">
            <label>Role</label>
            <div class="input-wrap">
              <span class="input-icon">🏷</span>
              <select formControlName="role" class="form-control">
                <option value="Customer">Customer</option>
                <option value="Seller">Seller</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-register">
          Create Account →
        </button>

      </form>

      <p class="terms">
        By continuing, you agree to LuxeCommerce's
        <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>.
      </p>

    </div>
  </div>
</div>
